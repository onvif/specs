id: https://www.onvif.org/ver10/agentic/linkml/
name: onvif-agentic-service
description: ONVIF Agentic Service base schema
prefixes:
  linkml: https://w3id.org/linkml/
  onvif: https://www.onvif.org/ver10/agentic/linkml/
imports:
  - linkml:types
  - enums
  - common
default_prefix: onvif
default_range: string

classes:

  VendorExtension:
    abstract: false
    is_a: Extensible
    description: >-
      Container for a single vendor-specific extension entry.
    attributes:
      vendor_namespace:
        range: uri
        required: true
        description: URI namespace that uniquely identifies the vendor.
      name:
        range: string
        required: true
        description: Local name of the extension element within the vendor namespace.
      value:
        range: Any
        required: false
        description: Vendor-specific payload.

  VendorExtensible:
    abstract: false
    is_a: Extensible
    description: >-
      Concrete container for grouping multiple vendor-specific extensions.
    attributes:
      vendorExtensions:
        range: VendorExtension
        multivalued: true
        inlined_as_list: true
        required: false
        description: Zero or more vendor-specific extension entries.

  Extensible:
    abstract: true
    description: >-
      Abstract class carrying extensions.

  InformationItem:
    abstract: true
    description: >-
      Abstract base container for a single unit of information.
    attributes:
      confidence:
        range: float
        required: true
        description: Confidence level associated with the information.
      productionTime:
        range: Time
        required: true
        description: Production timestamp of the information item.
      provenance:
        range: Provenance
        required: true
        description: Provenance of the information item.
      extensible:
        range: Extensible
        required: false
        description: Optional vendor extension container.

  InformationEnvelope:
    description: >-
      Optional container that groups one or more information items and may
      carry a single envelope-level signature.
    attributes:
      items:
        range: InformationItem
        multivalued: true
        inlined_as_list: true
        required: true
        description: One or more enclosed information items.
      signature:
        range: Signature
        required: false
        description: Optional envelope-level signature.

  Signature:
    abstract: true
    description: >-
      Abstract cryptographic attestation descriptor.
    attributes:
      extensible:
        range: Extensible
        required: false
        description: Optional vendor extension container.

  JsonLDSignature:
    is_a: Signature
    description: >-
      Concrete Signature profile based on JSON-LD Data Integrity proofs.
    attributes:
      type:
        range: string
        required: true
        equals_string: "DataIntegrityProof"
        description: Data Integrity proof type.
      cryptosuite:
        range: string
        required: true
        description: Cryptographic suite identifier.
      created:
        range: datetime
        required: true
        description: Proof creation time in ISO 8601 UTC.
      verificationMethod:
        range: uriorcurie
        required: true
        description: Verification method URI.
      proofPurpose:
        range: string
        required: true
        equals_string: "assertionMethod"
        description: Proof purpose value.
      proofValue:
        range: string
        required: true
        description: Encoded digital signature value.

  Time:
    abstract: true
    description: >-
      Abstract production-time descriptor for an InformationItem.
    attributes:
      extensible:
        range: Extensible
        required: false
        description: Optional vendor extension container.

  ISO8601Timestamp:
    abstract: false
    is_a: Time
    description: >-
      An ISO 8601 timestamp is an internationally agreed-upon format for
      representing dates and times as YYYY-MM-DDTHH:MM:SS
      (e.g., 2026-09-09T15:54:00), designed to be clear for both humans
      and machines
    attributes:
      timestamp:
        range: datetime
        required: true
        description: The ISO 8601 timestamp

  ISO8601Interval:
    abstract: false
    is_a: Time
    description: >-
      An ISO 8601 time interval represented as a single string
      (e.g., '2026-09-09T15:00:00Z/2026-09-09T16:00:00Z' or
      '2026-09-09T15:00:00Z/P1M' or 'R5/2026-09-09T15:00:00Z/P1M').
    attributes:
      intervalString:
        range: string
        required: true
        description: The time interval formatted according to the ISO 8601 standard.

  Provenance:
    abstract: true
    description: >-
      Abstract provenance descriptor for an InformationItem.
    attributes:
      extensible:
        range: Extensible
        required: false
        description: Optional vendor extension container.

  Location:
    abstract: true
    description: >-
      Abstract spatial descriptor for an InformationItem.
    attributes:
      extensible:
        range: Extensible
        required: false
        description: Optional vendor extension container.

  Observation:
    abstract: true
    is_a: InformationItem
    description: >-
      Abstract InformationItem representing a measurement generated by an
      ONVIF Device.
    attributes:
      observedTime:
        range: Time
        required: false
        description: Temporal context observed by this observation.
      observedSpace:
        range: Location
        required: false
        description: Spatial context observed by this observation.

  VehicleObservation:
    abstract: false
    is_a: Observation
    description: Information about a vehicle.
    attributes:
      type:
        range: VehicleType
        required: true
        description: >-
          The type of the vehicle. Acceptable values are typically defined
          in VehicleType.
      brand:
        range: StringLikelihood
        required: false
        description: The brand of the vehicle
      model:
        range: StringLikelihood
        required: false
        description: The model of the vehicle
      color:
        description: Descriptor for the vehicle's color.
        range: ColorDescriptor
        required: false

  LicensePlateObservation:
    abstract: false
    is_a: Observation
    description: Information about a vehicle's license plate.
    attributes:
      plateNumber:
        description: A string representing the vehicle license plate number.
        range: StringLikelihood
        required: true
      plateType:
        description: >-
          A description of the vehicle license plate type (e.g., "Normal",
          "Police", "Diplomat").
        range: PlateType
        required: false
      countryCode:
        description: >-
          Describes the country of the license plate. The country code shall 
          be encoded as two letter code according to ISO 3166-1:2013 Alpha-2.
        range: StringLikelihood
        required: false
      issuingEntity:
        description: >-
          State, province, or authority that issues the license plate.
        range: StringLikelihood
        required: false

  BarcodeObservation:
    abstract: false
    is_a: Observation
    description: Information extracted from a barcode.
    attributes:
      data:
        description: Information encoded in barcode.
        range: StringLikelihood
        required: true
      type:
        description: Type of the barcode. Acceptable values are defined in BarcodeType.
        range: BarcodeTypeLikelihood
        required: false
      ppm:
        description: Refers to the pixels per module.
        range: float
        required: false

  Assertion:
    abstract: true
    is_a: InformationItem
    description: >-
      Abstract InformationItem representing a statement supported by one or
      more information items.
    attributes:
      supportedBy:
        range: InformationItem
        multivalued: true
        inlined_as_list: true
        required: true
        description: One or more supporting information items.
