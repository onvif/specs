id: https://www.onvif.org/ver10/agentic/time/linkml/
name: onvif-agentic-time
description: ONVIF Agentic Service time schema
prefixes:
  linkml: https://w3id.org/linkml/
  onvif: https://www.onvif.org/ver10/agentic/linkml/
imports:
  - linkml:types
  - common
default_prefix: onvif
default_range: string

classes:

  Time:
    abstract: true
    description: >-
      Abstract production-time descriptor for an InformationItem.
    attributes:
      '@type':
        designates_type: true
        range: string
        required: true
        description: >-
          The local name of the concrete time descriptor this object
          instantiates, for example ISO8601Timestamp. It is required for the
          reason given for the type designator of InformationItem.
      extensible:
        range: Extensible
        required: false
        description: Optional vendor extension container.

  ISO8601Timestamp:
    abstract: false
    is_a: Time
    description: >-
      An ISO 8601 timestamp is an internationally agreed-upon format for
      representing dates and times as YYYY-MM-DDTHH:MM:SS
      (e.g., 2026-09-09T15:54:00), designed to be clear for both humans
      and machines
    attributes:
      timestamp:
        range: datetime
        required: true
        description: The ISO 8601 timestamp

  ISO8601Interval:
    abstract: false
    is_a: Time
    description: >-
      An ISO 8601 time interval represented as a single string
      (e.g., '2026-09-09T15:00:00Z/2026-09-09T16:00:00Z' or
      '2026-09-09T15:00:00Z/P1M' or 'R5/2026-09-09T15:00:00Z/P1M').
    attributes:
      intervalString:
        range: string
        required: true
        description: The time interval formatted according to the ISO 8601 standard.
