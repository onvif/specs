id: https://www.onvif.org/ver10/agentic/linkml/
name: onvif-agentic-service
description: ONVIF Agentic Service base schema
prefixes:
  linkml: https://w3id.org/linkml/
  onvif: https://www.onvif.org/ver10/agentic/linkml/
imports:
  - linkml:types
  - base
default_prefix: onvif
default_range: string

# Classes are declared in dependency order: no class refers to a class declared
# below it. The two groups are, in order: the abstract bases that a Tool's config
# argument, result and static capabilities object specialise, and the classes of
# the Tools common to every conforming device - get_status and the reserved
# set_event_stream_parameters Tool. There is no function-catalogue class in this
# module: every other Tool an ONVIF endpoint exposes is announced directly by
# tools/list, not through a generic wrapper or a separate catalogue Tool.

classes:

  # --- Abstract bases -------------------------------------------------------

  ToolConfig:
    abstract: true
    description: >-
      Abstract base of the single config object an ONVIF Client passes in the
      arguments.config of a tools/call request. A concrete subclass exists for
      every Tool this specification or a vendor module defines, and is compiled
      directly into the inputSchema of the Tool's descriptor, as returned by
      tools/list. There is no shared range through which several Tools' config
      classes are referenced polymorphically, so this base carries no type
      designator: every example of a config object in this specification is
      exactly the shape of its one concrete class.
    attributes:
      extensible:
        range: Extensible
        required: false
        description: Optional vendor extension container.

  ToolResult:
    abstract: true
    description: >-
      Abstract base class for the structuredContent object returned by a Tool
      invoked with tools/call, where the Tool returns one. A concrete subclass
      exists for every Tool that returns a structured result; which one applies
      is fixed by the outputSchema of the Tool's descriptor. A Tool that starts
      a continuous execution returns no structuredContent of this kind for that
      call: it returns a Task instead, whose taskId is the identifier of the
      execution for its whole lifetime, carried at the JSON-RPC result level and
      not as a field of this class.
    attributes:
      extensible:
        range: Extensible
        required: false
        description: Optional vendor extension container.

  ToolCapabilities:
    abstract: true
    description: >-
      Abstract base class for the static capabilities of a Tool: the invariant
      properties that describe what a device instance supports for that Tool,
      such as a concurrency ceiling, as distinct from the outcome of any
      particular invocation. A concrete subclass exists for a Tool that declares
      typed capabilities in _meta["org.onvif/capabilities"] of its tools/list
      descriptor; a Tool whose capabilities need no structure of their own may
      carry a plain object there instead.
    attributes:
      extensible:
        range: Extensible
        required: false
        description: Optional vendor extension container.

  # --- Tools common to every conforming device ------------------------------

  GetStatus:
    is_a: ToolConfig
    description: >-
      Empty config object accepted by the get_status Tool. The Tool takes
      an empty config, so its JSON Schema accepts an empty object and no
      properties beyond those ToolConfig declares.
    annotations:
      mcp_tool: get_status
      access_class: READ_SYSTEM

  ActiveExecution:
    description: >-
      An execution visible to the calling principal when the ONVIF Device
      answers get_status.
    attributes:
      name:
        range: string
        required: true
        description: Name of the Tool that created or represents the execution.
      taskId:
        range: string
        required: false
        description: >-
          Identifier of the MCP task that represents this execution, where the
          execution is backed by a task the client can follow. An execution the
          ONVIF Device started on its own - at factory default, or otherwise
          outside any client request - omits this field rather than inventing
          an identifier for an execution no task ever represented.

  GetStatusResponse:
    is_a: ToolResult
    description: >-
      Structured result returned by the get_status Tool.
    attributes:
      state:
        range: AgenticEngineState
        required: true
        description: Current operational state of the analytics engine.
      activeExecutions:
        range: ActiveExecution
        multivalued: true
        inlined_as_list: true
        required: true
        description: >-
          Inventory of executions visible to the calling principal, or an empty
          list when none is active. This is not a substitute for tasks/get,
          which gives the detailed, authoritative status of the one execution
          named by a particular taskId, nor for tasks/list, which this version
          of the MCP Tasks extension does not define.
      engineVersion:
        range: string
        required: true
        description: Version of the agentic engine firmware.

  # --- Reserved Tool: set_event_stream_parameters -----------------------------

  SetEventStreamParametersRequest:
    abstract: false
    is_a: ToolConfig
    annotations:
      mcp_tool: set_event_stream_parameters
      access_class: ACTUATE
    description: >-
      The config object accepted by the reserved set_event_stream_parameters
      Tool. The Tool sets the settable parameters of the event stream; at
      present the only one is the interval at which the ONVIF Device emits
      notifications/events/heartbeat keep-alive messages on open events/stream
      responses.

      The invariant properties of the event stream, such as the number of
      concurrent streams the ONVIF Device supports, are not set here. They are
      announced in _meta["org.onvif/capabilities"] of this Tool's tools/list
      descriptor, defined by EventStreamCapabilities.
    attributes:
      keepaliveIntervalMs:
        range: integer
        required: false
        unit:
          ucum_code: ms
        description: >-
          Requested interval, in milliseconds, between two consecutive
          keep-alive notifications on an events/stream response. When it is
          omitted the ONVIF Device applies the interval it declares in
          EventStreamCapabilities.defaultKeepaliveIntervalMs; no default value
          is fixed here, because the value is a property of the device and not
          of this specification. This specification defines no global supported
          range; the ONVIF Device declares its range in EventStreamCapabilities,
          clamps the requested value to that range, and reports the value actually applied in
          SetEventStreamParametersResponse.appliedKeepaliveIntervalMs.
      subscriptionId:
        range: integer
        required: false
        description: >-
          JSON-RPC id of the events/stream request to which the new interval
          applies. When omitted, the new interval applies to every stream
          opened by the authenticated principal, including streams opened
          after this call.

  SetEventStreamParametersResponse:
    abstract: false
    is_a: ToolResult
    description: >-
      Structured result returned by the reserved set_event_stream_parameters
      Tool.
    attributes:
      appliedKeepaliveIntervalMs:
        range: integer
        required: true
        unit:
          ucum_code: ms
        description: >-
          Keep-alive interval actually applied by the ONVIF Device, in
          milliseconds. This value is authoritative and may differ from the
          requested one when the request was clamped.
      clamped:
        range: boolean
        required: false
        ifabsent: 'boolean(false)'
        description: >-
          Whether the requested interval was clamped to the range supported by
          the ONVIF Device. When true, appliedKeepaliveIntervalMs differs from
          the requested value. The supported range itself is announced in
          _meta["org.onvif/capabilities"] of this Tool's tools/list descriptor.
      affectedStreams:
        range: integer
        multivalued: true
        inlined_as_list: true
        required: false
        description: >-
          JSON-RPC ids of the events/stream requests to which the applied
          interval was propagated.

  EventStreamCapabilities:
    abstract: false
    is_a: ToolCapabilities
    description: >-
      Static capabilities of the reserved set_event_stream_parameters Tool,
      which are the invariant properties of the event stream of an ONVIF Device:
      the keep-alive interval range it supports, the interval it uses when none
      was requested, and the number of concurrent streams it can serve. These
      values do not depend on any invocation, and are announced in
      _meta["org.onvif/capabilities"] of this Tool's tools/list descriptor.

      The class covers the event stream as a whole and not the keep-alive
      mechanism alone, because an ONVIF Client has to know the stream limits
      before it opens a stream, and the reserved Tool that configures the
      stream is the one place in this model where those limits have an owner.
    attributes:
      defaultKeepaliveIntervalMs:
        range: integer
        required: true
        unit:
          ucum_code: ms
        description: >-
          Keep-alive interval used by the ONVIF Device when none was requested,
          in milliseconds. This specification fixes no value for it: an ONVIF
          Device chooses one and declares it here, which is why the slot is
          mandatory while its value is not prescribed. The MCP Events draft
          recommends that a server send a heartbeat at least every 30 seconds;
          that recommendation does not prescribe an ONVIF Device default or
          supported range.
      minKeepaliveIntervalMs:
        range: integer
        required: true
        unit:
          ucum_code: ms
        description: >-
          Shortest keep-alive interval supported by the ONVIF Device, in
          milliseconds. A shorter requested interval is clamped to this value.
      maxKeepaliveIntervalMs:
        range: integer
        required: true
        unit:
          ucum_code: ms
        description: >-
          Longest keep-alive interval supported by the ONVIF Device, in
          milliseconds. A longer requested interval is clamped to this value.
      maxConcurrentStreams:
        range: integer
        required: true
        minimum_value: 1
        description: >-
          Greatest number of events/stream requests the ONVIF Device serves
          concurrently for the authenticated principal. An ONVIF Client holds
          one stream per subscription, so this value bounds the number of
          subscriptions it can receive by push at any one time.

          The value is at least 1. A request that would exceed it is rejected
          with -32013 ResourceExhausted, which an ONVIF Client can avoid
          entirely by reading this value before it opens a stream.
