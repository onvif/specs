id: https://www.onvif.org/ver10/agentic/enum/linkml/
name: onvif-agentic-enum
description: ONVIF Agentic Service enums
prefixes:
  linkml: https://w3id.org/linkml/
  onvif: https://www.onvif.org/ver10/agentic/linkml/
imports:
  - linkml:types
default_prefix: onvif
default_range: string

enums:

  BarcodeType:
    description: Standard formats for barcodes and 2D codes.
    permissible_values:
      Code39:
        title: "Code-39"
      Code49:
        title: "Code-49"
      Code93:
        title: "Code-93"
      Code128:
        title: "Code-128"
      Code11:
        title: "Code-11"
      Code25Interleaved:
        title: "Code-25-Interleaved"
      Code25NonInterleaved:
        title: "Code-25-NonInterleaved"
      DataMatrix:
      Maxicode:
      Postnet:
      RM4SCC:
        description: RoyalMail
      ISBN13:
        title: "ISBN-13"
      ISBN13Dual:
        title: "ISBN-13-Dual"
      ISBN10:
        title: "ISBN-10"
      ITF14:
        title: "ITF-14"
      EAN2:
        title: "EAN-2"
      EAN8:
        title: "EAN-8"
      EAN13:
        title: "EAN-13"
      EAN14:
        title: "EAN-14"
      EAN18:
        title: "EAN-18"
      EAN99:
        title: "EAN-99"
      EAN128:
        title: "EAN-128"
      SCC14:
        title: "SCC-14"
      SSCC18:
        title: "SSCC-18"
      UPCA:
        title: "UPC-A"
      UPCE:
        title: "UPC-E"
      PDF417:
      QRCode:

  Colorspace:
    description: Acceptable colorspace URIs for color representation.
    permissible_values:
      YCbCr:
        meaning: "http://www.onvif.org/ver10/colorspace/YCbCr"
        description: YCbCr colorspace (default if absent).
      RGB:
        meaning: "http://www.onvif.org/ver10/colorspace/RGB"
        description: RGB colorspace.
      CIELUV:
        meaning: "http://www.onvif.org/ver10/colorspace/CIELUV"
        description: CIE LUV colorspace (Deprecated).
      CIELAB:
        meaning: "http://www.onvif.org/ver10/colorspace/CIELAB"
        description: CIE 1976 (L*a*b*) colorspace (Deprecated).
      HSV:
        meaning: "http://www.onvif.org/ver10/colorspace/HSV"
        description: HSV colorspace (Deprecated).

  PlateType:
    description: Acceptable values for license plate types.
    permissible_values:
      Normal:
      Police:
      Diplomat:
      Temporary:

  VehicleType:
    description: >-
      Allowed vehicle types. Bus, Car, Truck, Bicycle and Motorcycle mirror
      tt:VehicleType of the ONVIF Schema; Van, Other and Unknown extend it, so
      this enumeration is a superset of tt:VehicleType and not a strict mapping
      of it.
    permissible_values:
      Bus:
      Car:
      Truck:
      Van:
      Bicycle:
      Motorcycle:
      Other:
        description: The type was determined, but it is not one of the values above.
      Unknown:
        description: >-
          A vehicle was detected but its type could not be determined. This is
          the value to use when classification failed or was not attempted,
          since type is a required slot.

  VehicleUse:
    description: >-
      Allowed uses of a vehicle. The use of a vehicle is orthogonal to its
      type: an ambulance is a Van, a Truck or a Car that is put to emergency
      medical service. This enumeration has no counterpart in the ONVIF Schema.
    permissible_values:
      Private:
      Taxi:
      PublicTransport:
      Delivery:
      Ambulance:
      Police:
      Fire:
      Other:
        description: The use was determined, but it is not one of the values above.
      Unknown:
        description: >-
          The use could not be determined, although the ONVIF Device does
          classify vehicle use. It is distinct from the absence of the use
          slot, which states that the device does not classify use at all.

  DigestAlgorithm:
    description: >-
      Hash algorithms that may be used to digest a canonicalised
      InformationItem, to compute the envelope digest, and to compute the
      fingerprint of a public key. Each permissible value carries, in its
      meaning, the object identifier of the algorithm, so that the formal
      identifier is the same one used by the ONVIF Media Signing
      Specification.

      This enumeration only fixes the wire representation of an algorithm
      name. It is not a statement of which algorithms are acceptable: the
      algorithm an ONVIF Device shall use, and the algorithms an ONVIF Client
      shall accept, are those mandated by the current version of the ONVIF
      Security Baseline. Where the two disagree, the ONVIF Security Baseline
      prevails, and a value listed here may well be forbidden by it.
    permissible_values:
      SHA256:
        meaning: "urn:oid:2.16.840.1.101.3.4.2.1"
        description: SHA-256 as specified in FIPS 180-4.
      SHA384:
        meaning: "urn:oid:2.16.840.1.101.3.4.2.2"
        description: SHA-384 as specified in FIPS 180-4.
      SHA512:
        meaning: "urn:oid:2.16.840.1.101.3.4.2.3"
        description: SHA-512 as specified in FIPS 180-4.

  SignatureAlgorithm:
    description: >-
      Signature algorithms that may be used to sign an envelope digest. Each
      permissible value carries, in its meaning, the object identifier of the
      algorithm.

      This enumeration only fixes the wire representation of an algorithm
      name. It is not a statement of which algorithms are acceptable: the
      algorithm an ONVIF Device shall use, and the algorithms an ONVIF Client
      shall accept, are those mandated by the current version of the ONVIF
      Security Baseline. Where the two disagree, the ONVIF Security Baseline
      prevails, and a value listed here may well be forbidden by it.
    permissible_values:
      ECDSA_P256_SHA256:
        meaning: "urn:oid:1.2.840.10045.4.3.2"
        description: ECDSA over NIST P-256 with SHA-256.
      ECDSA_P384_SHA384:
        meaning: "urn:oid:1.2.840.10045.4.3.3"
        description: ECDSA over NIST P-384 with SHA-384.
      ECDSA_P521_SHA512:
        meaning: "urn:oid:1.2.840.10045.4.3.4"
        description: ECDSA over NIST P-521 with SHA-512.
      RSASSA_PSS:
        meaning: "urn:oid:1.2.840.113549.1.1.10"
        description: >-
          RSASSA-PSS. The digest used within the padding scheme is the one
          declared by the digestAlgorithm field.
