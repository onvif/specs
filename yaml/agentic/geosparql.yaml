id: https://www.onvif.org/ver10/agentic/geosparql/linkml/
name: onvif-agentic-geosparql
description: GeoSPARQL 1.1 spatial vocabulary for Agentic locations
prefixes:
  linkml: https://w3id.org/linkml/
  onvif: https://www.onvif.org/ver10/agentic/linkml/
  geo: http://www.opengis.net/ont/geosparql#
  rdfs: http://www.w3.org/2000/01/rdf-schema#
imports:
  - base
default_prefix: onvif
default_range: string

slots:
  sfEquals:
    range: Any
    multivalued: true
    inlined: true
    any_of:
      - range: UUID
      - range: GeoSpatialObject
    description: A spatial object, either embedded or cited by UUID.
    slot_uri: geo:sfEquals
  sfDisjoint:
    range: Any
    multivalued: true
    inlined: true
    any_of:
      - range: UUID
      - range: GeoSpatialObject
    slot_uri: geo:sfDisjoint
  sfIntersects:
    range: Any
    multivalued: true
    inlined: true
    any_of:
      - range: UUID
      - range: GeoSpatialObject
    slot_uri: geo:sfIntersects
  sfTouches:
    range: Any
    multivalued: true
    inlined: true
    any_of:
      - range: UUID
      - range: GeoSpatialObject
    slot_uri: geo:sfTouches
  sfCrosses:
    range: Any
    multivalued: true
    inlined: true
    any_of:
      - range: UUID
      - range: GeoSpatialObject
    slot_uri: geo:sfCrosses
  sfWithin:
    range: Any
    multivalued: true
    inlined: true
    any_of:
      - range: UUID
      - range: GeoSpatialObject
    slot_uri: geo:sfWithin
  sfContains:
    range: Any
    multivalued: true
    inlined: true
    any_of:
      - range: UUID
      - range: GeoSpatialObject
    slot_uri: geo:sfContains
  sfOverlaps:
    range: Any
    multivalued: true
    inlined: true
    any_of:
      - range: UUID
      - range: GeoSpatialObject
    slot_uri: geo:sfOverlaps
  ehEquals:
    range: Any
    multivalued: true
    inlined: true
    any_of:
      - range: UUID
      - range: GeoSpatialObject
    slot_uri: geo:ehEquals
  ehDisjoint:
    range: Any
    multivalued: true
    inlined: true
    any_of:
      - range: UUID
      - range: GeoSpatialObject
    slot_uri: geo:ehDisjoint
  ehMeet:
    range: Any
    multivalued: true
    inlined: true
    any_of:
      - range: UUID
      - range: GeoSpatialObject
    slot_uri: geo:ehMeet
  ehOverlap:
    range: Any
    multivalued: true
    inlined: true
    any_of:
      - range: UUID
      - range: GeoSpatialObject
    slot_uri: geo:ehOverlap
  ehCovers:
    range: Any
    multivalued: true
    inlined: true
    any_of:
      - range: UUID
      - range: GeoSpatialObject
    slot_uri: geo:ehCovers
  ehCoveredBy:
    range: Any
    multivalued: true
    inlined: true
    any_of:
      - range: UUID
      - range: GeoSpatialObject
    slot_uri: geo:ehCoveredBy
  ehInside:
    range: Any
    multivalued: true
    inlined: true
    any_of:
      - range: UUID
      - range: GeoSpatialObject
    slot_uri: geo:ehInside
  ehContains:
    range: Any
    multivalued: true
    inlined: true
    any_of:
      - range: UUID
      - range: GeoSpatialObject
    slot_uri: geo:ehContains
  rcc8eq:
    range: Any
    multivalued: true
    inlined: true
    any_of:
      - range: UUID
      - range: GeoSpatialObject
    slot_uri: geo:rcc8eq
  rcc8dc:
    range: Any
    multivalued: true
    inlined: true
    any_of:
      - range: UUID
      - range: GeoSpatialObject
    slot_uri: geo:rcc8dc
  rcc8ec:
    range: Any
    multivalued: true
    inlined: true
    any_of:
      - range: UUID
      - range: GeoSpatialObject
    slot_uri: geo:rcc8ec
  rcc8po:
    range: Any
    multivalued: true
    inlined: true
    any_of:
      - range: UUID
      - range: GeoSpatialObject
    slot_uri: geo:rcc8po
  rcc8tpp:
    range: Any
    multivalued: true
    inlined: true
    any_of:
      - range: UUID
      - range: GeoSpatialObject
    slot_uri: geo:rcc8tpp
  rcc8tppi:
    range: Any
    multivalued: true
    inlined: true
    any_of:
      - range: UUID
      - range: GeoSpatialObject
    slot_uri: geo:rcc8tppi
  rcc8ntpp:
    range: Any
    multivalued: true
    inlined: true
    any_of:
      - range: UUID
      - range: GeoSpatialObject
    slot_uri: geo:rcc8ntpp
  rcc8ntppi:
    range: Any
    multivalued: true
    inlined: true
    any_of:
      - range: UUID
      - range: GeoSpatialObject
    slot_uri: geo:rcc8ntppi
  geometry:
    range: UUID
    multivalued: true
    inlined: false
    slot_uri: geo:hasGeometry
    description: UUIDs of the geometries representing the feature.
  defaultGeometry:
    range: UUID
    multivalued: true
    inlined: false
    slot_uri: geo:hasDefaultGeometry
    description: UUIDs of the default geometries of the feature.
  boundingBox:
    range: UUID
    multivalued: true
    inlined: false
    slot_uri: geo:hasBoundingBox
    description: UUIDs of the bounding geometries of the feature.
  centroid:
    range: UUID
    multivalued: true
    inlined: false
    slot_uri: geo:hasCentroid
    description: UUIDs of the centroid geometries of the feature.
  member:
    slot_uri: rdfs:member
    range: UUID
    multivalued: true
    inlined: false
    description: >-
      UUIDs of the spatial objects in this collection. The objects are
      referenced rather than embedded; their types are checked on resolution.
      GeoFeatureCollection admits only GeoFeature objects and
      GeoGeometryCollection only GeoGeometry objects. These target type
      constraints cannot be checked from UUIDs alone.

classes:
  GeoJSONGeometry:
    class_uri: linkml:Any
    description: >-
      An RFC 7946 GeoJSON Geometry object, including optional foreign members.
      The unconstrained LinkML representation does not validate its structure;
      implementations shall validate it separately.

  GeoSpatialObject:
    is_a: Location
    class_uri: geo:SpatialObject
    description: A spatially located feature or geometry.
    slots:
      - sfEquals
      - sfDisjoint
      - sfIntersects
      - sfTouches
      - sfCrosses
      - sfWithin
      - sfContains
      - sfOverlaps
      - ehEquals
      - ehDisjoint
      - ehMeet
      - ehOverlap
      - ehCovers
      - ehCoveredBy
      - ehInside
      - ehContains
      - rcc8eq
      - rcc8dc
      - rcc8ec
      - rcc8po
      - rcc8tpp
      - rcc8tppi
      - rcc8ntpp
      - rcc8ntppi
    attributes:
      size:
        slot_uri: geo:hasSize
        range: Any
        inlined: true
        multivalued: true
        description: Measurement nodes describing size in a non-metric unit.
      length:
        slot_uri: geo:hasLength
        range: Any
        inlined: true
        multivalued: true
        description: Measurement nodes describing length in a non-metric unit.
      perimeterLength:
        slot_uri: geo:hasPerimeterLength
        range: Any
        inlined: true
        multivalued: true
        description: Measurement nodes describing perimeter in a non-metric unit.
      area:
        slot_uri: geo:hasArea
        range: Any
        inlined: true
        multivalued: true
        description: Measurement nodes describing area in a non-metric unit.
      volume:
        slot_uri: geo:hasVolume
        range: Any
        inlined: true
        multivalued: true
        description: Measurement nodes describing volume in a non-metric unit.
      metricSize:
        slot_uri: geo:hasMetricSize
        range: double
        multivalued: true
      metricLength:
        slot_uri: geo:hasMetricLength
        range: double
        multivalued: true
      metricPerimeterLength:
        slot_uri: geo:hasMetricPerimeterLength
        range: double
        multivalued: true
      metricArea:
        slot_uri: geo:hasMetricArea
        range: double
        multivalued: true
      metricVolume:
        slot_uri: geo:hasMetricVolume
        range: double
        multivalued: true

  GeoFeature:
    is_a: GeoSpatialObject
    class_uri: geo:Feature
    description: A real-world entity with a spatial presence.
    slots:
      - geometry
      - defaultGeometry
      - boundingBox
      - centroid

  GeoGeometry:
    is_a: GeoSpatialObject
    class_uri: geo:Geometry
    description: A coherent set of direct positions in a spatial reference system.
    attributes:
      asGeoJSON:
        slot_uri: onvif:asGeoJSON
        range: GeoJSONGeometry
        multivalued: true
        inlined: true
        inlined_as_list: true
        description: >-
          GeoJSON Geometry objects, not strings. JSON-LD maps the complete list
          to an rdf:JSON literal; export to GeoSPARQL requires conversion of
          each object to a separate geo:geoJSONLiteral.
      dimension:
        slot_uri: geo:dimension
        range: integer
        multivalued: true
      coordinateDimension:
        slot_uri: geo:coordinateDimension
        range: integer
        multivalued: true
      spatialDimension:
        slot_uri: geo:spatialDimension
        range: integer
        multivalued: true
      spatialResolution:
        slot_uri: geo:hasSpatialResolution
        range: Any
        inlined: true
        multivalued: true
        description: Measurement nodes describing spatial resolution.
      metricSpatialResolution:
        slot_uri: geo:hasMetricSpatialResolution
        range: double
        multivalued: true
      spatialAccuracy:
        slot_uri: geo:hasSpatialAccuracy
        range: Any
        inlined: true
        multivalued: true
        description: Measurement nodes describing spatial accuracy.
      metricSpatialAccuracy:
        slot_uri: geo:hasMetricSpatialAccuracy
        range: double
        multivalued: true
      empty:
        slot_uri: geo:isEmpty
        range: boolean
        multivalued: true
      simple:
        slot_uri: geo:isSimple
        range: boolean
        multivalued: true

  GeoSpatialObjectCollection:
    is_a: Location
    class_uri: geo:SpatialObjectCollection
    description: A collection of spatial objects, not a GeoSpatialObject.
    slots:
      - member
  GeoFeatureCollection:
    is_a: GeoSpatialObjectCollection
    class_uri: geo:FeatureCollection
    description: A collection of references to features.
  GeoGeometryCollection:
    is_a: GeoSpatialObjectCollection
    class_uri: geo:GeometryCollection
    description: A collection of references to geometries.
