id: https://www.onvif.org/ver10/agentic/common/linkml/
name: onvif-agentic-common
description: ONVIF Agentic Service common schema
prefixes:
  linkml: https://w3id.org/linkml/
  onvif: https://www.onvif.org/ver10/agentic/linkml/
imports:
  - linkml:types
  - enums
default_prefix: onvif
default_range: string

types:
  Likelihood:
    typeof: float
    description: >-
      A float value representing a probability or likelihood, constrained
      between 0.0 and 1.0.
    minimum_value: 0.0
    maximum_value: 1.0

  UUID:
    typeof: string
    description: >-
      Universally Unique Identifier in the canonical lowercase hyphenated
      form specified in RFC 9562. Used as the range of every object
      identifier slot in this model.
    pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'

  Base64Binary:
    typeof: string
    description: >-
      Binary value encoded with the standard base64 alphabet defined in
      RFC 4648, including padding.
    pattern: '^[A-Za-z0-9+/]+={0,2}$'

  ReferenceToken:
    typeof: string
    description: >-
      Unique identifier referencing a physical or logical resource of an
      ONVIF Device. It mirrors tt:ReferenceToken of the ONVIF Schema, and is
      therefore limited to 64 characters.
    pattern: '^.{1,64}$'

  KeyID:
    typeof: string
    description: >-
      Unique identifier of a key in the keystore of an ONVIF Device. It
      mirrors tas:KeyID of the ONVIF Advanced Security Service, which is an
      XML NCName limited to 64 characters. Using the same identifier space
      allows a key named here to be looked up in the keystore of the device.
    pattern: '^[A-Za-z_][A-Za-z0-9._-]{0,63}$'

classes:

  Extensible:
    abstract: true
    description: >-
      Abstract class carrying extensions. It is used as the range of an
      optional slot named extensible, which classes that support vendor
      extensions declare individually; it is not intended to be inherited
      via is_a, as it carries no attributes of its own. The only exceptions
      are VendorExtension and VendorExtensible, which are themselves
      extension containers.
    comments:
      - 'Declare an optional slot "extensible" with range Extensible on a class
        that supports vendor extensions. Do not inherit it with is_a.'

  VendorExtension:
    abstract: false
    is_a: Extensible
    description: >-
      Container for a single vendor-specific extension entry.
    attributes:
      vendor_namespace:
        range: uri
        required: true
        description: URI namespace that uniquely identifies the vendor.
      name:
        range: string
        required: true
        description: Local name of the extension element within the vendor namespace.
      value:
        range: Any
        required: false
        description: Vendor-specific payload.

  VendorExtensible:
    abstract: false
    is_a: Extensible
    description: >-
      Concrete container for grouping multiple vendor-specific extensions.
    attributes:
      vendorExtensions:
        range: VendorExtension
        multivalued: true
        inlined_as_list: true
        required: false
        description: Zero or more vendor-specific extension entries.

  Any:
    description: >-
      A dynamic type that allows arbitrary nested data.
    class_uri: linkml:Any

  StringLikelihood:
    description: >-
      A compound data structure combining a string value with a likelihood
      score.
    attributes:
      value:
        description: The primary string value.
        range: string
        required: true
      likelihood:
        description: The float value representing the likelihood.
        range: Likelihood
        required: true

  BarcodeTypeLikelihood:
    description: >-
      A compound data structure combining a barcode type with a likelihood
      score.
    attributes:
      value:
        description: The primary barcode type.
        range: BarcodeType
        required: true
      likelihood:
        description: The float value representing the likelihood.
        range: Likelihood
        required: true

  Color:
    description: >-
      Represents a color defined by three coordinates (X, Y, Z) in a
      specific colorspace. If the colorspace is absent and not defined on
      a higher level, YCbCr is implied.
    attributes:
      x:
        description: >-
          The X coordinate of the color (e.g., Y value in YCbCr, R value in
          RGB).
        range: float
        required: true
      y:
        description: >-
          The Y coordinate of the color (e.g., Cb value in YCbCr, G value in
          RGB).
        range: float
        required: true
      z:
        description: >-
          The Z coordinate of the color (e.g., Cr value in YCbCr, B value in
          RGB).
        range: float
        required: true
      colorspace:
        description: URI defining the colorspace.
        range: Colorspace
        required: false
      likelihood:
        description: Likelihood that the color is correct.
        range: Likelihood
        required: false

  ColorCovariance:
    description: Represents the covariance matrix associated with a color distribution.
    attributes:
      xx:
        description: Variance in the X dimension.
        range: float
        required: true
      yy:
        description: Variance in the Y dimension.
        range: float
        required: true
      zz:
        description: Variance in the Z dimension.
        range: float
        required: true
      xy:
        description: Covariance between X and Y dimensions.
        range: float
        required: false
      xz:
        description: Covariance between X and Z dimensions.
        range: float
        required: false
      yz:
        description: Covariance between Y and Z dimensions.
        range: float
        required: false
      colorspace:
        description: URI defining the colorspace.
        range: Colorspace
        required: false

  ColorCluster:
    description: >-
      A grouping of a specific color with its associated weight and
      covariance.
    attributes:
      color:
        description: The primary color value.
        range: Color
        required: true
      weight:
        description: >-
          The weight of the color in the cluster (e.g., percentage or ratio).
        range: float
        required: false
      covariance:
        description: The color covariance matrix or values.
        range: ColorCovariance
        required: false

  ColorDescriptor:
    description: A descriptor containing one or more color clusters associated with an object.
    attributes:
      color_cluster:
        description: A list of color clusters.
        range: ColorCluster
        multivalued: true
        required: false
