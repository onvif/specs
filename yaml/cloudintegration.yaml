openapi: 3.0.4
info:
  title: Cloud Integration Specification
  contact:
    name: ONVIF Technical Specification
    url: https://www.onvif.org/profiles/specifications/
  license:
    name: ONVIF Contributor License Agreement
    url: https://github.com/onvif/specs/blob/development/LICENSE.md
  version: "25.12"
  x-logo:
    url: https://www.onvif.org/logo.gif
    background: "#ffffff"
    altText: "ONVIF logo"

components:
  schemas:
    base64DerEncodedAsn1Value:
      description: This schema is the equivalent of tas:Base64DERencodedASN1Value in the Security Service specification.
      type: string
      format: byte

    endpointReferenceType:
      description: This schema is the equivalent of wsa:EndpointReferenceType in the WA-Addressing 1.0 specification.
      type: string
      format: uri

    authorizationServerConfiguration:
      type: object
      description: This schema is the equivalent of tas:AuthorizationServerConfigurationData
      properties:
        serverUri:
          description: Authorization server address
          type: string
        clientId:
          description: Client identifier issued by the authorization server
          type: string
        scope:
          description: The requested access scope
          type: string
        certPathValidationPolicyAlias:
          description: The alias of the certPathValidationPolicy to be used with this configuration
          type: string
      required:
        - serverUri
        - clientId
        - certPathValidationPolicyAlias

    uplinkConfiguration:
      type: object
      properties:
        remoteAddress:
          description: Uniform resource locator by which the remote client can be reached.
          $ref: '#/components/schemas/endpointReferenceType'
        userLevel:
          description: Authorization level that will be assigned to the uplink connection.
          type: string
          enum: [Administrator, Operator, User]
        certPathValidationPolicyAlias:
          description: The alias of the certPathValidationPolicy to be used with this configuration
          type: string
      required:
        - remoteAddress
        - userLevel
        - certPathValidationPolicyAlias

    deviceConfiguration:
      type: object
      properties:
        shareToken:
          description: The share token, to prove permission to share the device.
          type: string
          format: byte
        endpointReferences:
          description: The full URI if the endpoint to be notified to inform that the operation was completed. It may be more then one if the requesting cloud has redundant URIs to receive the notification.
          items:
            $ref: '#/components/schemas/endpointReferenceType'
        uplinkConfigurations:
          description: Per-device uplink configuration
          items:
            $ref: '#/components/schemas/uplinkConfiguration'
        authorizationServerConfigurations:
          items:
            $ref: '#/components/schemas/authorizationServerConfiguration'
        certPathValidationPolicies:
          description: List of certificate validation policies that can be referenced by alias
          items:
            $ref: '#/components/schemas/certPathValidationPolicy'
      required:
        - shareToken
        - endpointReferences
        - uplinkConfigurations
        - authorizationServerConfigurations
        - certPathValidationPolicies

    startDeviceSharing:
      type: object
      properties:
        deviceConfigurations:
          items:
            $ref: '#/components/schemas/deviceConfiguration'
          description: For each camera requested to be shared, it is necessary to pass both the shared token and the endpoint reference.
      required:
        - deviceConfigurations

    deviceSharingCompleted:
      type: object
      properties:
        shareToken:
          description: The share token identifying the device.
          type: string
        devicePublicKey:
          description: The public key of the device.
          $ref: '#/components/schemas/base64DerEncodedAsn1Value'
        configurationErrors:
          $ref: '#/components/schemas/deviceConfigurationErrors'
      required:
        - shareToken
        - devicePublicKey

    deviceConfigurationErrors:
      type: object
      description: >-
        Failures applying the deviceConfiguration identified by shareToken.
        Omitted or empty maps mean no failures were reported.
      properties:
        certPathValidationPolicies:
          type: object
          description: Policy and trust anchor failures, keyed by the original policy alias.
          additionalProperties:
            $ref: '#/components/schemas/certPathValidationPolicyError'
        authorizationServerConfigurations:
          type: object
          description: Authorization server failures, keyed by the original serverUri.
          additionalProperties:
            $ref: '#/components/schemas/configurationError'
        uplinkConfigurations:
          type: object
          description: Uplink failures, keyed by the original remoteAddress.
          additionalProperties:
            $ref: '#/components/schemas/configurationError'

    configurationError:
      type: object
      properties:
        reason:
          type: string
          minLength: 1
          description: >-
            Human-readable failure reason. For SOAP faults, use one Reason/Text value.
            Use fault codes, not this text, for classification.
          example: The specified signature algorithm is not supported by the device.
        fault:
          $ref: '#/components/schemas/fault'
      required:
        - reason

    certPathValidationPolicyError:
      type: object
      description: >-
        Policy-level error and/or individual trust anchor failures.
        Include at least one of error or trustAnchors when reporting a failure.
      properties:
        error:
          $ref: '#/components/schemas/configurationError'
        trustAnchors:
          type: object
          minProperties: 1
          description: >-
            Certificate import failures, keyed by the exact base64-encoded anchor
            from the original policy's trustAnchors collection.
          additionalProperties:
            $ref: '#/components/schemas/configurationError'

    fault:
      type: object
      description: >-
        Code and subcodes from the SOAP 1.2 fault, when available.
        Omit for failures without a SOAP fault.
      properties:
        code:
          $ref: '#/components/schemas/faultQualifiedName'
        subcodes:
          type: array
          description: >-
            SOAP Subcode/Value entries, ordered from outermost to innermost.
          items:
            $ref: '#/components/schemas/faultQualifiedName'
      required:
        - code
      example:
        code: soapenv:Sender
        subcodes:
          - ter:InvalidArgVal
          - ter:UnsupportedSignatureAlgorithm

    faultQualifiedName:
      type: string
      pattern: '^[A-Za-z_][A-Za-z0-9_.-]*:[A-Za-z_][A-Za-z0-9_.-]*$'
      description: >-
        SOAP Code/Value or Subcode/Value in prefix:localName form.
        Normalize prefixes to those listed in ONVIF Core (soapenv and ter).
      example: ter:UnsupportedSignatureAlgorithm

    deviceSharingError:
      type: object
      properties:
        error:
          type: string
          enum: [ "Invalid configuration", "Invalid JWT" ]
      required:
        - error

    certPathValidationPolicy:
      type: object
      properties:
        alias:
          description: The alias to be used for the CertPathValidationPolicy
          type: string
        trustAnchors:
          description: List of trust anchors in base64DerEncodedAsn1Value
          items:
            $ref: '#/components/schemas/base64DerEncodedAsn1Value'
      required:
        - alias
        - trustAnchors

paths:
  /startDeviceSharing:
    post:
      summary: Start device sharing.
      description: This operation triggers sharing a device with a new Operational Cloud Service.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/startDeviceSharing'
      responses:
        '200':
          description: Success
        '400':
          description: Invalid Argument Value
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/deviceSharingError'

  /deviceSharingCompleted:
    post:
      summary: Device sharing completed notification.
      description: Notifies the new Operational Cloud Service that configuration has completed, including reported failures.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/deviceSharingCompleted'
      responses:
        '200':
          description: Success

  /getAvailableFWImages:
    post:
      summary: Returns the list of FW images currently available on the manufacturer cloud for the given model.
      description: The value of model must be the value returned in the model field of GetDeviceInformationResponse
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                model:
                  type: string
      responses:
        '200':
          description: Successfully returned a list of FW versions available for the given model.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
        '400':
          description: Invalid Argument Value
