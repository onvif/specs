id: https://www.onvif.org/ver10/agentic/enum/linkml/
name: onvif-agentic-enum
description: ONVIF Agentic Service enums
prefixes:
  linkml: https://w3id.org/linkml/
  onvif: https://www.onvif.org/ver10/agentic/linkml/
imports:
  - linkml:types
default_prefix: onvif
default_range: string

enums:

  BarcodeType:
    description: Standard formats for barcodes and 2D codes.
    permissible_values:
      Code39:
        text: "Code-39"
      Code49:
        text: "Code-49"
      Code93:
        text: "Code-93"
      Code128:
        text: "Code-128"
      Code11:
        text: "Code-11"
      Code25Interleaved:
        text: "Code-25-Interleaved"
      Code25NonInterleaved:
        text: "Code-25-NonInterleaved"
      DataMatrix:
      Maxicode:
      Postnet:
      RM4SCC:
        description: RoyalMail
      ISBN13:
        text: "ISBN-13"
      ISBN13Dual:
        text: "ISBN-13-Dual"
      ISBN10:
        text: "ISBN-10"
      ITF14:
        text: "ITF-14"
      EAN2:
        text: "EAN-2"
      EAN8:
        text: "EAN-8"
      EAN13:
        text: "EAN-13"
      EAN14:
        text: "EAN-14"
      EAN18:
        text: "EAN-18"
      EAN99:
        text: "EAN-99"
      EAN128:
        text: "EAN-128"
      SCC14:
        text: "SCC-14"
      SSCC18:
        text: "SSCC-18"
      UPCA:
        text: "UPC-A"
      UPCE:
        text: "UPC-E"
      PDF417:
      QRCode:

  Colorspace:
    description: Acceptable colorspace URIs for color representation.
    permissible_values:
      YCbCr:
        text: "http://www.onvif.org/ver10/colorspace/YCbCr"
        description: YCbCr colorspace (default if absent).
      RGB:
        text: "http://www.onvif.org/ver10/colorspace/RGB"
        description: RGB colorspace.
      CIELUV:
        text: "http://www.onvif.org/ver10/colorspace/CIELUV"
        description: CIE LUV colorspace (Deprecated).
      CIELAB:
        text: "http://www.onvif.org/ver10/colorspace/CIELAB"
        description: CIE 1976 (L*a*b*) colorspace (Deprecated).
      HSV:
        text: "http://www.onvif.org/ver10/colorspace/HSV"
        description: HSV colorspace (Deprecated).

  PlateType:
    description: Acceptable values for license plate types.
    permissible_values:
      Normal:
      Police:
      Diplomat:
      Temporary:

  VehicleType:
    description: Allowed vehicle types (mapped from tt:VehicleType).
    permissible_values:
      Bus:
      Car:
      Truck:
      Bicycle:
      Motorcycle:
