<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" width="720" height="440">
  <defs>
    <marker id="arrBlue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2471A3"/>
    </marker>
    <marker id="arrGreen" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#1E8449"/>
    </marker>
    <marker id="arrOrange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#B7770D"/>
    </marker>
  </defs>

  <!-- ═══════════════════════════════════════════════════════ -->
  <!-- OIDC / Authorization Server                            -->
  <!-- ═══════════════════════════════════════════════════════ -->
  <rect x="260" y="20" width="200" height="66" rx="8"
        fill="#D6EAF8" stroke="#2471A3" stroke-width="2"/>
  <text x="360" y="47" text-anchor="middle"
        font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="#1A5276">OIDC Authorization Server</text>
  <text x="360" y="66" text-anchor="middle"
        font-family="Arial,sans-serif" font-size="11" fill="#1A5276">Issues ES256 JWTs · Exposes JWKS</text>

  <!-- ═══════════════════════════════════════════════════════ -->
  <!-- VMS / MCP Host  (left)                                 -->
  <!-- ═══════════════════════════════════════════════════════ -->
  <rect x="30" y="210" width="205" height="105" rx="8"
        fill="#D5F5E3" stroke="#1E8449" stroke-width="2"/>
  <text x="132" y="237" text-anchor="middle"
        font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="#145A32">VMS / MCP Host</text>
  <text x="132" y="257" text-anchor="middle"
        font-family="Arial,sans-serif" font-size="11" fill="#145A32">Layer 1 — ONVIF Client</text>
  <text x="132" y="274" text-anchor="middle"
        font-family="Arial,sans-serif" font-size="11" fill="#145A32">Layer 2 — LinkML Validator</text>
  <text x="132" y="291" text-anchor="middle"
        font-family="Arial,sans-serif" font-size="11" fill="#145A32">OAuth2 token consumer</text>
  <text x="132" y="308" text-anchor="middle"
        font-family="Arial,sans-serif" font-size="10" fill="#1E8449">[ 0 ]  OIDC  ·  [ 1 ]  VMS  ·  [ 2 ]  Validator</text>

  <!-- ═══════════════════════════════════════════════════════ -->
  <!-- AI Service / MCP Server  (right)                       -->
  <!-- ═══════════════════════════════════════════════════════ -->
  <rect x="485" y="210" width="205" height="105" rx="8"
        fill="#FEF9E7" stroke="#B7770D" stroke-width="2"/>
  <text x="587" y="237" text-anchor="middle"
        font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="#7D6608">AI Service / MCP Server</text>
  <text x="587" y="257" text-anchor="middle"
        font-family="Arial,sans-serif" font-size="11" fill="#7D6608">Layer 3 — MCP Server endpoint</text>
  <text x="587" y="274" text-anchor="middle"
        font-family="Arial,sans-serif" font-size="11" fill="#7D6608">Layer 4 — Skills (MCP Tools)</text>
  <text x="587" y="291" text-anchor="middle"
        font-family="Arial,sans-serif" font-size="11" fill="#7D6608">Layer 5 — Metadata Publisher</text>
  <text x="587" y="308" text-anchor="middle"
        font-family="Arial,sans-serif" font-size="10" fill="#B7770D">[ 3..7 ]  MCP Server  ·  Schema  ·  Bridge</text>

  <!-- ═══════════════════════════════════════════════════════ -->
  <!-- JWT arrow: OIDC ─► VMS  (dashed blue)                 -->
  <!-- ═══════════════════════════════════════════════════════ -->
  <line x1="295" y1="86" x2="145" y2="210"
        stroke="#2471A3" stroke-width="1.5" stroke-dasharray="6,3"
        marker-end="url(#arrBlue)"/>
  <!-- label at midpoint, offset slightly right -->
  <rect x="152" y="138" width="90" height="18" rx="3" fill="white" fill-opacity="0.8"/>
  <text x="197" y="152" text-anchor="middle"
        font-family="Arial,sans-serif" font-size="11" fill="#2471A3">Bearer JWT</text>

  <!-- ═══════════════════════════════════════════════════════ -->
  <!-- JWKS arrow: AI Service ─► OIDC  (dashed blue)         -->
  <!-- ═══════════════════════════════════════════════════════ -->
  <line x1="545" y1="210" x2="430" y2="86"
        stroke="#2471A3" stroke-width="1.5" stroke-dasharray="6,3"
        marker-end="url(#arrBlue)"/>
  <!-- label at midpoint -->
  <rect x="458" y="138" width="78" height="18" rx="3" fill="white" fill-opacity="0.8"/>
  <text x="497" y="152" text-anchor="middle"
        font-family="Arial,sans-serif" font-size="11" fill="#2471A3">GET /.../jwks</text>

  <!-- ═══════════════════════════════════════════════════════ -->
  <!-- Control Bus (A): VMS ─► AI Service                     -->
  <!-- ═══════════════════════════════════════════════════════ -->
  <!-- label above the arrow line -->
  <text x="360" y="358" text-anchor="middle"
        font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="#1E8449">Control Bus (A)</text>
  <text x="360" y="374" text-anchor="middle"
        font-family="Arial,sans-serif" font-size="11" fill="#1E8449">MCP tools/call · Authorization: Bearer JWT</text>
  <line x1="235" y1="347" x2="485" y2="347"
        stroke="#1E8449" stroke-width="2.5" marker-end="url(#arrGreen)"/>

  <!-- ═══════════════════════════════════════════════════════ -->
  <!-- Data Bus (B): AI Service ─► VMS                        -->
  <!-- ═══════════════════════════════════════════════════════ -->
  <line x1="485" y1="395" x2="235" y2="395"
        stroke="#B7770D" stroke-width="2.5" marker-end="url(#arrOrange)"/>
  <!-- label below the arrow line -->
  <text x="360" y="413" text-anchor="middle"
        font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="#B7770D">Data Bus (B)</text>
  <text x="360" y="430" text-anchor="middle"
        font-family="Arial,sans-serif" font-size="11" fill="#B7770D">JSON-LD metadata events · SSE / notifications/message</text>
</svg>
