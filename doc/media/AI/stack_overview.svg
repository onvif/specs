<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 440" width="920" height="440">
  <defs>
    <marker id="arrBlue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2471A3"/>
    </marker>
    <marker id="arrGreen" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#1E8449"/>
    </marker>
    <marker id="arrOrange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#B7770D"/>
    </marker>
  </defs>

  <!-- ═══════════════════════════════════════════════════════ -->
  <!-- OIDC / Authorization Server                            -->
  <!-- ═══════════════════════════════════════════════════════ -->
  <rect x="360" y="20" width="200" height="66" rx="8"
        fill="#D6EAF8" stroke="#2471A3" stroke-width="2"/>
  <text x="460" y="47" text-anchor="middle"
        font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="#1A5276">OIDC Authorization Server</text>
  <text x="460" y="66" text-anchor="middle"
        font-family="Arial,sans-serif" font-size="11" fill="#1A5276">Issues ES256 JWTs · Exposes JWKS</text>

  <!-- ═══════════════════════════════════════════════════════ -->
  <!-- VMS / MCP Host  (left)                                 -->
  <!-- ═══════════════════════════════════════════════════════ -->
  <rect x="20" y="210" width="310" height="105" rx="8"
        fill="#D5F5E3" stroke="#1E8449" stroke-width="2"/>
  <text x="175" y="237" text-anchor="middle"
        font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="#145A32">VMS / MCP Host</text>
  <text x="32" y="257" text-anchor="start"
        font-family="Arial,sans-serif" font-size="11" fill="#145A32">Application Layer — ONVIF Client</text>
  <text x="32" y="274" text-anchor="start"
        font-family="Arial,sans-serif" font-size="11" fill="#145A32">Protocol Layer — MCP Client</text>
  <text x="32" y="291" text-anchor="start"
        font-family="Arial,sans-serif" font-size="11" fill="#145A32">Data Model Layer — LinkML Validator</text>
  <text x="32" y="308" text-anchor="start"
        font-family="Arial,sans-serif" font-size="10" fill="#1E8449">Security/Transport — OAuth 2.1 bearer token (JWT) over TLS</text>

  <!-- ═══════════════════════════════════════════════════════ -->
  <!-- AI Service / MCP Server  (right)                       -->
  <!-- ═══════════════════════════════════════════════════════ -->
  <rect x="590" y="210" width="310" height="105" rx="8"
        fill="#FEF9E7" stroke="#B7770D" stroke-width="2"/>
  <text x="745" y="237" text-anchor="middle"
        font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="#7D6608">AI Service / MCP Server</text>
  <text x="602" y="257" text-anchor="start"
        font-family="Arial,sans-serif" font-size="11" fill="#7D6608">Application Layer — ONVIF Skills (MCP Tools)</text>
  <text x="602" y="274" text-anchor="start"
        font-family="Arial,sans-serif" font-size="11" fill="#7D6608">Protocol Layer — MCP Server endpoint</text>
  <text x="602" y="291" text-anchor="start"
        font-family="Arial,sans-serif" font-size="11" fill="#7D6608">Data Model Layer — Metadata Publisher</text>
  <text x="602" y="308" text-anchor="start"
        font-family="Arial,sans-serif" font-size="10" fill="#B7770D">Security/Transport — OAuth 2.1 bearer token (JWT) over TLS</text>

  <!-- ═══════════════════════════════════════════════════════ -->
  <!-- JWT arrow: OIDC ─► VMS  (dashed blue)                 -->
  <!-- ═══════════════════════════════════════════════════════ -->
  <line x1="390" y1="86" x2="200" y2="210"
        stroke="#2471A3" stroke-width="1.5" stroke-dasharray="6,3"
        marker-end="url(#arrBlue)"/>
  <rect x="230" y="138" width="90" height="18" rx="3" fill="white" fill-opacity="0.8"/>
  <text x="275" y="152" text-anchor="middle"
        font-family="Arial,sans-serif" font-size="11" fill="#2471A3">Bearer JWT</text>

  <!-- ═══════════════════════════════════════════════════════ -->
  <!-- JWKS arrow: AI Service ─► OIDC  (dashed blue)         -->
  <!-- ═══════════════════════════════════════════════════════ -->
  <line x1="660" y1="210" x2="530" y2="86"
        stroke="#2471A3" stroke-width="1.5" stroke-dasharray="6,3"
        marker-end="url(#arrBlue)"/>
  <rect x="558" y="138" width="78" height="18" rx="3" fill="white" fill-opacity="0.8"/>
  <text x="597" y="152" text-anchor="middle"
        font-family="Arial,sans-serif" font-size="11" fill="#2471A3">GET /.../jwks</text>

  <!-- ═══════════════════════════════════════════════════════ -->
  <!-- Control Plane (A): VMS ─► AI Service                   -->
  <!-- ═══════════════════════════════════════════════════════ -->
  <text x="460" y="358" text-anchor="middle"
        font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="#1E8449">Control Plane (A)</text>
  <text x="460" y="374" text-anchor="middle"
        font-family="Arial,sans-serif" font-size="11" fill="#1E8449">MCP tools/call · Authorization: Bearer JWT</text>
  <line x1="330" y1="347" x2="590" y2="347"
        stroke="#1E8449" stroke-width="2.5" marker-end="url(#arrGreen)"/>

  <!-- ═══════════════════════════════════════════════════════ -->
  <!-- Event Plane (B): AI Service ─► VMS                     -->
  <!-- ═══════════════════════════════════════════════════════ -->
  <line x1="590" y1="395" x2="330" y2="395"
        stroke="#B7770D" stroke-width="2.5" marker-end="url(#arrOrange)"/>
  <text x="460" y="413" text-anchor="middle"
        font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="#B7770D">Event Plane (B)</text>
  <text x="460" y="430" text-anchor="middle"
        font-family="Arial,sans-serif" font-size="11" fill="#B7770D">JSON-LD metadata events · SSE / notifications/message</text>
</svg>
