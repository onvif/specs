<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="1000" height="620">
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2471A3"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#1E8449"/>
    </marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#B7770D"/>
    </marker>
  </defs>

  <style>
    .title { font: bold 18px Arial, sans-serif; fill: #202020; }
    .label { font: 13px Arial, sans-serif; fill: #202020; }
    .small { font: 12px Arial, sans-serif; fill: #404040; }
    .box-title { font: bold 16px Arial, sans-serif; }
    .client { fill: #145A32; }
    .device { fill: #7D6608; }
    .auth { fill: #1A5276; }
  </style>

  <text x="500" y="34" text-anchor="middle" class="title">ONVIF Agentic Protocol Stack</text>

  <rect x="350" y="58" width="300" height="78" rx="9" fill="#D6EAF8" stroke="#2471A3" stroke-width="2"/>
  <text x="500" y="87" text-anchor="middle" class="box-title auth">OAuth 2.1 Authorization Server</text>
  <text x="500" y="109" text-anchor="middle" class="small">Client Credentials · ES256 JWT · JWKS endpoint</text>

  <rect x="45" y="245" width="300" height="290" rx="9" fill="#D5F5E3" stroke="#1E8449" stroke-width="2"/>
  <text x="195" y="275" text-anchor="middle" class="box-title client">ONVIF Client / MCP Host</text>
  <text x="195" y="304" text-anchor="middle" class="label client">ONVIF Client and MCP Host</text>
  <text x="195" y="327" text-anchor="middle" class="label client">LinkML Schema Registry</text>
  <text x="195" y="350" text-anchor="middle" class="label client">JSON Schema event validator</text>
  <rect x="74" y="456" width="242" height="48" rx="5" fill="#F7FFFA" stroke="#1E8449" stroke-width="1.5"/>
  <text x="195" y="477" text-anchor="middle" class="label client">HTTPS callback endpoint</text>
  <text x="195" y="495" text-anchor="middle" class="small">optional webhook receiver</text>

  <rect x="655" y="245" width="300" height="290" rx="9" fill="#FEF9E7" stroke="#B7770D" stroke-width="2"/>
  <text x="805" y="275" text-anchor="middle" class="box-title device">ONVIF Device / MCP Server</text>
  <text x="805" y="304" text-anchor="middle" class="label device">/mcp endpoint</text>
  <text x="805" y="327" text-anchor="middle" class="label device">MCP Tools and LinkML Resources</text>
  <text x="805" y="350" text-anchor="middle" class="label device">Metadata event publisher</text>
  <text x="805" y="397" text-anchor="middle" class="small">validates every bearer token</text>
  <text x="805" y="416" text-anchor="middle" class="small">against Authorization Server JWKS</text>

  <line x1="405" y1="136" x2="250" y2="245" stroke="#2471A3" stroke-width="2" stroke-dasharray="7,4" marker-end="url(#arrow-blue)"/>
  <text x="258" y="168" text-anchor="middle" class="small" fill="#2471A3">OAuth 2.1 Client Credentials</text>
  <text x="258" y="185" text-anchor="middle" class="small" fill="#2471A3">ES256 bearer JWT</text>

  <line x1="745" y1="245" x2="595" y2="136" stroke="#2471A3" stroke-width="2" stroke-dasharray="7,4" marker-end="url(#arrow-blue)"/>
  <text x="748" y="168" text-anchor="middle" class="small" fill="#2471A3">JWKS retrieval</text>

  <rect x="360" y="257" width="280" height="172" rx="9" fill="#F4F6F7" stroke="#566573" stroke-width="1.5"/>
  <text x="500" y="284" text-anchor="middle" class="box-title">Single MCP channel</text>
  <text x="500" y="306" text-anchor="middle" class="small">MCP 2026-07-28 · Streamable HTTP</text>
  <text x="500" y="324" text-anchor="middle" class="small">HTTP/1.1 or HTTP/2 over TLS 1.3</text>
  <text x="500" y="342" text-anchor="middle" class="small">Authorization header: ES256 JWT</text>
  <line x1="345" y1="361" x2="655" y2="361" stroke="#1E8449" stroke-width="2.5" marker-end="url(#arrow-green)"/>
  <text x="500" y="356" text-anchor="middle" class="small" fill="#145A32">JSON-RPC requests: discovery, Tools, Resources, Events</text>
  <line x1="655" y1="400" x2="345" y2="400" stroke="#1E8449" stroke-width="2.5" marker-end="url(#arrow-green)"/>
  <text x="500" y="420" text-anchor="middle" class="small" fill="#145A32">responses; events/stream SSE notifications and keep-alives</text>

  <line x1="655" y1="480" x2="316" y2="480" stroke="#B7770D" stroke-width="2.5" stroke-dasharray="8,5" marker-end="url(#arrow-orange)"/>
  <text x="500" y="558" text-anchor="middle" class="label" fill="#7D6608">Optional webhook delivery: HTTPS POST EventOccurrence</text>
  <text x="500" y="577" text-anchor="middle" class="small" fill="#7D6608">configured with events/subscribe</text>

  <text x="500" y="590" text-anchor="middle" class="small">All request/response traffic and push delivery use the single /mcp channel; webhooks are out-of-band.</text>
</svg>
