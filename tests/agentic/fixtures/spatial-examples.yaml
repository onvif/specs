id: https://example.org/onvif/spatial-examples/schema
name: spatial-examples
description: Illustrative observation specialization used only by the spatial fixtures.
prefixes:
  spatialExample: https://example.org/onvif/spatial-examples/
default_prefix: spatialExample
imports:
  - ../../../yaml/agentic/agentic
  - ../../../yaml/agentic/hackathon
classes:
  SpatialObservation:
    is_a: Observation
    description: Example vehicle detection with the generic Location extension point.
    slot_usage:
      result:
        range: VehicleDetectionResult
        value_presence: PRESENT
        required: true
